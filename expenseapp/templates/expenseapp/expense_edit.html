<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Expense</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        margin: 0;
    }

    .container {
        width: 90%;
        max-width: 600px;
        margin: 60px auto;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 7px;
        cursor: pointer;
    }

    a {
        margin-left: 15px;
        text-decoration: none;
        color: #555;
    }

</style>
```

</head>

<body>

<div class="container">

```
<div class="card">

    <h1>✏️ Edit Expense</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Update Expense
        </button>

        <a href="{% url 'expense_list' %}">
            Cancel
        </a>

    </form>

</div>


</div>

</body>

</html>
